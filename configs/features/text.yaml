# @package _global_
# B1: CLAP text features of the films (one vector and one token sequence per film).
# Run with `just extract-text`; overrides go after the recipe name, e.g.
#   just extract-text 'variants=[full]' max_films=50
defaults:
  - /paths: default
  - _self_

# Must be the same checkpoint as the music target (C2) and MusicLDM: ucsd-reach/musicldm,
# subfolders text_encoder and tokenizer.
model_id: ucsd-reach/musicldm

# One row per film. Column names are the ones expected in OSSL-v2's metadata.csv: check them
# against the real header (the script lists the available columns if one is missing).
metadata_path: ${paths.ossl_dir}/metadata.csv
columns:
  movie_id: movie_id
  genres: genres
  year: year
  synopsis: imdb_description

# Folders written: ${paths.features_dir}/text/clap-<variant>/
variants: [full, noyear, genres, synopsis]
# Text features are per film, not per split: one "movies" set (contract 1.3, cache.py).
# The training code picks the films of a split from the segment's movie_id.
split_name: movies
# Hidden states are large (N x L x 768 float16) and only cross-attention reads them.
token_variants: [full]

batch_size: 32
# null = tokenizer.model_max_length (512 for MusicLDM's CLAP tokenizer; checked at run time).
max_length: null
# Development subset: the first N films by movie_id. null = every film.
max_films: null
device: auto
seed: 0
